<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    {% include head.html %}
    {% if page.head_extra %}{{ page.head_extra }}{% endif %}
  </head>
  <body{% if page.bubbles %} data-bubbles="{{ page.bubbles }}"{% endif %}{% if page.bubble_only %} data-bubble-only="{{ page.bubble_only }}"{% endif %}>
    <div class="grain" aria-hidden="true"></div>
    <div class="bubbles-bg" aria-hidden="true"></div>
    {% include nav.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}
    {% include scripts.html %}
  </body>
</html>
